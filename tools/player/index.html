<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song Player</title>
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dddbd5;
  --accent: #c2410c; --accent-soft: #fde7da; --beat: #fb923c; --loop: #dbeafe; --loop-line: #3b82f6;
  --chord: #9a3412; --warn-bg: #fef3c7; --warn-ink: #78350f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414; --panel: #1e1e1f; --ink: #ececec; --muted: #9a9aa0; --line: #333336;
    --accent: #fb923c; --accent-soft: #3a2416; --beat: #f97316; --loop: #172554; --loop-line: #60a5fa;
    --chord: #fdba74; --warn-bg: #422006; --warn-ink: #fde68a;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --panel: #1e1e1f; --ink: #ececec; --muted: #9a9aa0; --line: #333336;
  --accent: #fb923c; --accent-soft: #3a2416; --beat: #f97316; --loop: #172554; --loop-line: #60a5fa;
  --chord: #fdba74; --warn-bg: #422006; --warn-ink: #fde68a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; }
.top { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
h1 { font-size: 17px; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
button, select { font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
button.on { background: var(--accent-soft); border-color: var(--accent); }
button#play { min-width: 74px; font-weight: 600; }
#time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 92px; }
#seek { flex: 1; min-width: 140px; accent-color: var(--accent); }
.now { display: flex; gap: 22px; align-items: baseline; margin-left: auto; }
.now .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#nowChord { font-size: 30px; font-weight: 700; color: var(--chord); min-width: 2.5ch; display: inline-block; }
#nextChord { font-size: 20px; font-weight: 600; }
#nextIn { font-size: 12px; color: var(--muted); }
#beatDots { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
#beatDots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
#beatDots i.on { background: var(--beat); }
.warn { background: var(--warn-bg); color: var(--warn-ink); padding: 8px 16px; font-size: 13px; }
.warn a { color: inherit; font-weight: 600; }
.warn code { font: 12px ui-monospace, monospace; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  margin-bottom: 14px; }
.label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
  margin-bottom: 6px; }
/* one row = time | the bars of a lyric line | that lyric line */
.srow { display: grid; grid-template-columns: 44px minmax(0, 1.15fr) minmax(0, 1fr); column-gap: 18px;
  align-items: center; padding: 3px 0; }
@media (max-width: 900px) {
  .srow { grid-template-columns: 44px minmax(0, 1fr); row-gap: 2px; }
  .srow .ln { grid-column: 2; }
}
.margin { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: pointer; align-self: center; }
/* every beat is one column, so all beats are equally wide and bars are as long as their beats */
.bars { display: grid; grid-template-columns: repeat(var(--cols, 16), minmax(0, 1fr)); align-self: stretch; }
.bar { display: grid; border-left: 2px solid var(--line); padding: 2px 0; cursor: pointer; min-height: 34px;
  align-content: center; }
.bar:last-child { border-right: 2px solid var(--line); }
.bar.cur { background: var(--accent-soft); }
.bar.inloop { background: var(--loop); }
.bar.cur.inloop { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--loop-line); }
.cell { padding: 4px 3px; font-weight: 600; color: var(--chord); font-size: 14px;
  border-radius: 4px; min-width: 0; overflow: hidden; white-space: nowrap; }
.cell.dot { color: var(--line); font-weight: 400; }
.cell.carry { color: var(--muted); }
.cell.beat { outline: 2px solid var(--beat); outline-offset: -2px; }
.strumrow { grid-column: 1 / -1; display: grid; }
.strum { font-size: 12px; color: var(--muted); white-space: nowrap; padding: 0 3px; overflow: hidden; }
/* lyrics with chords above the words */
.ln { padding: 3px 6px; border-radius: 6px; display: flex; flex-wrap: wrap; align-items: flex-end; min-width: 0; }
.ln[data-line] { cursor: pointer; }
.ln[data-line]:hover { background: var(--bg); }
.ln.cur { background: var(--accent-soft); }
.chunk { display: inline-flex; flex-direction: column; white-space: pre; }
.chunk .c { color: var(--chord); font-weight: 700; font-size: 13px; min-height: 1.2em; padding-right: 4px; }
.chunk .t { min-height: 1.3em; }
.cmt { color: var(--muted); font-size: 12px; font-style: italic; padding: 0 6px; }
.help { color: var(--muted); font-size: 12px; margin-top: 6px; }
#syncStatus { font-size: 12px; color: var(--muted); }
.offbox { display: inline-flex; align-items: center; gap: 4px; }
.offlbl { font-size: 12px; color: var(--muted); }
.offbox button { min-width: 30px; font-weight: 700; }
#offReset { font-weight: 400; }
#offReset:disabled { opacity: .45; cursor: default; }
#offVal { font-variant-numeric: tabular-nums; font-size: 13px; min-width: 58px; text-align: center; }
#offVal.nonzero { color: var(--accent); font-weight: 600; }
#syncStatus.ok { color: #16a34a; }
#syncBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tapbanner { margin-top: 8px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft);
  border: 1px solid var(--accent); font-size: 15px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.tapbanner[hidden] { display: none; }
.tapbanner .dots { display: inline-flex; gap: 5px; }
.tapbanner .dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent); display: inline-block; }
.tapbanner .dots i.on { background: var(--accent); }
.tapbanner .sub { font-size: 12px; color: var(--muted); }
kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1 id="title">Loading…</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="now">
      <div><div class="lbl">Now <span id="beatDots"></span></div><span id="nowChord">–</span></div>
      <div><div class="lbl">Next</div><span id="nextChord">–</span> <span id="nextIn"></span></div>
    </div>
  </div>
  <div class="controls">
    <button id="play" title="Space">▶ Play</button>
    <span id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Position">
    <select id="speed" title="[ and ] to change">
      <option value="0.5">50%</option><option value="0.6">60%</option><option value="0.7">70%</option>
      <option value="0.75">75%</option><option value="0.85">85%</option><option value="0.9">90%</option>
      <option value="1" selected>100%</option>
    </select>
    <button id="loopBtn" title="L">Loop</button>
    <button id="clickBtn" title="C">Click</button>
    <button id="vocalBtn" title="V: mute or unmute the vocals" disabled>Vocals on</button>
    <button id="rhythmBtn" title="B: play only the drums and bass" disabled>Drums &amp; bass</button>
    <button id="followBtn" class="on" title="F">Follow</button>
    <button id="pitchBtn" title="P">Shapes</button>
    <button id="reloadBtn" title="R">Reload .cho</button>
    <button id="syncBtn" title="S: tap the space bar on every beat to sync">Tap to sync</button>
    <span class="offbox" title="How much later the beats start than the audio">
      <span class="offlbl">Beats</span>
      <button id="offMinus" title="Beats 10 ms earlier (− key)">−</button>
      <span id="offVal">0 ms</span>
      <button id="offPlus" title="Beats 10 ms later (+ key)">+</button>
      <button id="offReset" title="Back to 0 ms: audio and beats start together">Reset</button>
    </span>
    <span id="syncStatus"></span>
  </div>
  <div class="help">Click a bar, lyric line or time to jump · <kbd>Shift</kbd>+click a bar to loop from the last clicked bar ·
    <kbd>Space</kbd> play · <kbd>←</kbd>/<kbd>→</kbd> bar · <kbd>L</kbd> loop · <kbd>C</kbd> click · <kbd>V</kbd> vocals · <kbd>B</kbd> drums &amp; bass · <kbd>R</kbd> reload after editing · <kbd>S</kbd> tap to sync · <kbd>−</kbd>/<kbd>+</kbd> beats 10 ms earlier/later</div>
  <div id="tapInfo" class="tapbanner" hidden></div>
</header>
<div id="warn" class="warn" hidden></div>
<main id="main"></main>
<audio id="audio" preload="auto"></audio>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const audio = $("audio");
const params = new URLSearchParams(location.search);
const FILE_MODE = location.protocol === "file:";
const songParam = params.get("song") || "songs/Madeline.cho";
// song paths are relative to the server root (the guitarbook folder)
const songPath = FILE_MODE ? songParam : new URL(songParam, location.origin).href;

let song = null, sync = null;
let barEls = [];          // barEls[k] = element of bar k
let barCols = [];         // barCols[k] = its grid cells
let curCol = null;        // highlighted beat column
let lineEls = [];
let beatChord = [];       // effective chord per beat (as written)
let loopA = null, loopB = null, loopOn = false;
let follow = true, clickOn = false, sounding = false;
let curBar = -1, curBeat = -1, curLine = -1;

/* ---------------- ChordPro parsing (subset used by song2cho) ---------------- */
const BAR_RE = /^(\|\||\|\.|\|:|:\|:|:\||\||:?\|\d+>?)([sS])?$/;

function parseAttrs(s) {
  const o = {}; const re = /(\w+)="([^"]*)"/g; let m;
  while ((m = re.exec(s))) o[m[1]] = m[2];
  return o;
}

function parseCho(text) {
  const meta = {}; const blocks = []; let cur = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, "");
    const d = line.match(/^\s*\{([\w-]+)(?:[:\s]\s*(.*))?\}\s*$/);
    if (d) {
      const name = d[1].toLowerCase(), arg = (d[2] || "").trim();
      const so = name.match(/^(?:start_of_|so)(grid|verse|chorus|bridge|tab|g|v|c|b)$/);
      const eo = name.match(/^(?:end_of_|eo)(grid|verse|chorus|bridge|tab|g|v|c|b)$/);
      if (so) {
        const kind = { g: "grid", v: "verse", c: "chorus", b: "bridge" }[so[1]] || so[1];
        const at = parseAttrs(arg);
        cur = { type: kind === "grid" ? "grid" : "lyrics", env: kind, label: at.label || "", rows: [], lines: [] };
        blocks.push(cur);
      } else if (eo) { cur = null; }
      else if (["comment", "c", "comment_italic", "ci"].includes(name)) {
        blocks.push({ type: "comment", text: arg });
      } else { meta[name] = arg; }
      continue;
    }
    if (/^\s*#/.test(line)) continue;              // ChordPro comment
    if (cur && cur.type === "grid") { if (line.trim()) cur.rows.push(parseGridRow(line)); continue; }
    if (cur && cur.type === "lyrics") { if (line.trim()) cur.lines.push(parseLyric(line)); continue; }
    if (line.trim()) {                              // lyrics outside a section
      cur = null;
      const last = blocks[blocks.length - 1];
      if (last && last.type === "lyrics" && last.loose) last.lines.push(parseLyric(line));
      else blocks.push({ type: "lyrics", env: "verse", label: "", loose: true, lines: [parseLyric(line)] });
    }
  }
  return { meta, blocks };
}

function parseGridRow(line) {
  const toks = line.trim().split(/\s+/);
  const row = { bars: [], strum: false };
  let started = false, cells = null;
  for (const t of toks) {
    const m = t.match(BAR_RE);
    if (m) {
      if (m[2]) row.strum = true;
      if (cells && cells.length) row.bars.push(cells);
      cells = []; started = true; continue;
    }
    if (started) cells.push(t);                    // tokens before the first bar line: margin text
  }
  return row;                                      // cells after the last bar line: margin text
}

function parseLyric(line) {
  const chunks = []; const re = /\[([^\]]*)\]/g; let last = 0, m, chord = "";
  while ((m = re.exec(line))) {
    const txt = line.slice(last, m.index);
    if (txt || chord) chunks.push({ c: chord, t: txt });
    chord = m[1]; last = re.lastIndex;
  }
  chunks.push({ c: chord, t: line.slice(last) });
  return chunks.filter((c, i) => c.c || c.t || i === 0);
}

/* ---------------- chords ---------------- */
const SH = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FL = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
function transposeChord(c, n, flats) {
  if (!n) return c;
  return c.replace(/(^|\/)([A-G])([#b]?)/g, (_, pre, r, acc) => {
    let i = SH.indexOf(r + acc); if (i < 0) i = FL.indexOf(r + acc); if (i < 0) return pre + r + acc;
    return pre + (flats ? FL : SH)[(i + n + 12) % 12];
  });
}
let capo = 0, flatsSounding = false;
function show(c) { return sounding ? transposeChord(c, capo, flatsSounding) : c; }
const isChordToken = (t) => /^[A-G]/.test(t);

/* ---------------- rendering ---------------- */
function mmss(t) { t = Math.max(0, t); return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0"); }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
// which of `len` grid cells covers beat q of an n-beat bar
function cellIdx(q, len, n) { return Math.min(len - 1, Math.floor(q * len / n)); }
function median(arr) { const a = [...arr].sort((x, y) => x - y); return a[a.length >> 1]; }

function render() {
  const main = $("main"); main.innerHTML = "";
  barEls = []; barCols = []; lineEls = []; curCol = null;
  const warns = [];
  const meta = song.meta;
  capo = parseInt(meta.capo || "0", 10) || 0;
  const soundingKey = transposeChord(meta.key || "C", capo, false);
  flatsSounding = /^(F|Bb|Eb|Ab|Db|Gb|Dm|Gm|Cm|Fm|Bbm|Ebm)$/.test(soundingKey);
  $("title").textContent = meta.title || "Untitled";
  $("meta").textContent = [meta.artist, meta.key && ("key " + meta.key), capo ? "capo " + capo : "",
    meta.time, meta.tempo && meta.tempo + " bpm"].filter(Boolean).join(" · ");
  document.title = (meta.title || "Song") + " – Player";
  $("pitchBtn").textContent = sounding ? "Sounding" : (capo ? "Shapes (capo " + capo + ")" : "Shapes");
  $("pitchBtn").disabled = !capo;

  // all bars of all grids, in order (strum rows attach to the chord row above)
  const bars = [];
  const blockRange = new Map();
  song.blocks.forEach((b) => {
    if (b.type !== "grid") return;
    const k0 = bars.length; let rowStart = k0;
    for (const row of b.rows) {
      if (row.strum) { row.bars.forEach((cells, j) => { if (bars[rowStart + j]) bars[rowStart + j].strum = cells; }); continue; }
      rowStart = bars.length;
      row.bars.forEach((cells) => bars.push({ cells, strum: null }));
    }
    blockRange.set(b, [k0, bars.length]);
  });
  const barsMatch = !!sync && bars.length === sync.bars.length;

  // beats per bar, and the effective chord for every beat (drives Now/Next)
  beatChord = []; let prevChord = null, prevCells = null;
  bars.forEach((bar, k) => {
    const cells = bar.cells.join(" ") === "%" && prevCells ? prevCells : bar.cells;
    const bt = barsMatch ? sync.bars[k] : null;
    bar.n = bt ? bt[1] - bt[0] : cells.length;
    for (let q = 0; q < bar.n; q++) {
      const tok = cells[cellIdx(q, cells.length, bar.n)] || ".";
      const cs = tok.split("~").filter(isChordToken);
      if (cs.length) prevChord = cs[cs.length - 1];
      if (bt) beatChord[bt[0] + q] = prevChord;
    }
    prevCells = cells;
  });

  // lyric lines get a global index, matching sync.lines
  let gl = 0;
  for (const b of song.blocks) if (b.type === "lyrics") b.gLines = b.lines.map((chunks) => ({ chunks, g: gl++ }));
  const timed = barsMatch && gl === sync.lines.length;
  if (sync && !barsMatch) warns.push(`The .cho grids have ${bars.length} bars but the recording has ${sync.bars.length}. ` +
    `Add or remove bars so the counts match — until then bars and lyrics can't be lined up.`);
  else if (sync && gl !== sync.lines.length) warns.push(`The .cho has ${gl} lyric lines but the timing file has ${sync.lines.length}; ` +
    `bars and lyric lines can't be lined up until they match again.`);
  if (!sync) warns.push("No .sync.json timing file found next to the song — playback works but nothing will be highlighted.");

  // pair each grid with the lyrics section that follows it
  const items = [];
  for (let i = 0; i < song.blocks.length; i++) {
    const b = song.blocks[i], nx = song.blocks[i + 1];
    if (b.type === "grid" && nx && nx.type === "lyrics" && (!nx.label || nx.label === b.label)) { items.push([b, nx]); i++; }
    else items.push([b]);
  }

  // 1. cut every section into rows: a lyric line with the bars it is sung over,
  //    or (instrumental) up to 4 bars with no lyrics
  const barOfT = (t) => { const i = beatAt(t); return i < 0 ? 0 : barOfBeat(i); };
  const plain = (k0, k1, out) => { for (let k = k0; k < k1; k += 4) out.push({ k0: k, k1: Math.min(k1, k + 4) }); };
  const sections = [];
  for (const parts of items) {
    if (parts[0].type === "comment") { sections.push({ comment: parts[0].text }); continue; }
    const grid = parts[0].type === "grid" ? parts[0] : null;
    const lyr = parts.find((p) => p.type === "lyrics");
    const [k0, k1] = grid ? blockRange.get(grid) : [0, 0];
    const rows = [];
    if (grid && lyr && timed && lyr.gLines.length) {
      const starts = lyr.gLines.map(({ g }) => {
        const t = sync.lines[g][0];
        let b = Math.min(k1 - 1, Math.max(k0, barOfT(t)));
        if (beatAt(t) === sync.bars[b][1] - 1 && b + 1 < k1) b++;   // first word on a bar's last beat: a pickup
        return b;
      });
      for (let i = 1; i < starts.length; i++) starts[i] = Math.min(k1 - 1, Math.max(starts[i], starts[i - 1] + 1));
      if (starts[0] > k0) plain(k0, starts[0], rows);
      lyr.gLines.forEach(({ chunks, g }, i) => {
        let end = i + 1 < starts.length ? starts[i + 1] : k1, tail = null;
        if (i + 1 === starts.length) {                // long instrumental after the last line: own rows
          const words = sync.lines[g][2] || [];
          const lastBar = barOfT(words.length ? words[words.length - 1][0] : sync.lines[g][1]);
          if (end - (lastBar + 1) >= 2) { tail = [lastBar + 1, end]; end = lastBar + 1; }
        }
        rows.push({ k0: starts[i], k1: Math.max(end, starts[i] + 1), chunks, g });
        if (tail) plain(tail[0], tail[1], rows);
      });
    } else {                                          // not lined up: bars first, then the lyrics
      if (grid) plain(k0, k1, rows);
      if (lyr) lyr.gLines.forEach(({ chunks, g }) => rows.push({ k0: 0, k1: 0, chunks, g }));
    }
    sections.push({ label: parts[0].label || parts[0].env || "", rows, lyrics: !!lyr });
  }

  // 2. one width for every beat: the grid has as many columns as the longest row has beats
  const rowBeats = (r) => { let n = 0; for (let k = r.k0; k < r.k1; k++) n += bars[k].n; return n; };
  let cols = 4;
  for (const s of sections) for (const r of s.rows || []) cols = Math.max(cols, rowBeats(r));
  main.style.setProperty("--cols", cols);

  // 3. draw
  function makeBar(k, rowFirst) {
    const bar = bars[k];
    const be = el("div", "bar"); be.dataset.bar = k;
    be.style.gridColumn = "span " + bar.n;
    be.style.gridTemplateColumns = `repeat(${bar.cells.length}, minmax(0, 1fr))`;
    const cellEls = bar.cells.map((tok, i) => {
      const dot = tok === "." || tok === "/";
      const carry = rowFirst && i === 0 && dot && barsMatch && beatChord[sync.bars[k][0]];
      const c = carry ? el("div", "cell carry", show(carry))       // chord still ringing from the row above
        : el("div", "cell" + (dot ? " dot" : ""), tok.split("~").map((x) => isChordToken(x) ? show(x) : x).join(" "));
      be.append(c); return c;
    });
    if (bar.strum) {                                  // strum pattern under the chords
      const st = el("div", "strumrow"); st.style.gridTemplateColumns = `repeat(${bar.strum.length}, minmax(0, 1fr))`;
      bar.strum.forEach((tok) => st.append(el("div", "strum", tok.replace(/~/g, " "))));
      be.append(st);
    }
    barEls[k] = be; barCols[k] = cellEls;
    return be;
  }
  for (const s of sections) {
    if (s.comment) { main.append(el("div", "cmt", s.comment)); continue; }
    const sec = el("section", "section" + (s.lyrics ? "" : " nolyrics"));
    sec.append(el("div", "label", s.label));
    for (const r of s.rows) {
      const row = el("div", "srow");

  $("syncBtn").classList.remove("on"); $("syncBtn").textContent = "Tap to sync";
  if (msg) { drawTap(msg, true); tapTimer = setTimeout(() => { $("tapInfo").hidden = true; }, 3500); }
  else $("tapInfo").hidden = true;
}
function armTapTimeout() {
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => stopTapSync("No taps – sync unchanged."), 6000);
}
function drawTap(html, done) {
  const b = $("tapInfo"); b.hidden = false; b.innerHTML = "";
  const t = el("span"); t.innerHTML = html; b.append(t);
  if (!done) {
    const d = el("span", "dots");
    for (let i = 0; i < TAPS_NEEDED; i++) d.append(el("i", i < taps.length ? "on" : ""));
    b.append(d, el("span", "sub", "Esc to cancel"));
  }
}
function tap() {
  if (!tapMode || audio.paused) return;
  armTapTimeout();
  const at = audio.currentTime + syncOffset - trim;            // where the song is, without earlier taps
  const i = beatAt(at), bs = sync.beats;
  let best = bs[Math.max(0, i)];
  if (i + 1 < bs.length && Math.abs(bs[i + 1] - at) < Math.abs(best - at)) best = bs[i + 1];
  taps.push(best - at);
  if (taps.length < TAPS_NEEDED) { drawTap("Keep tapping on every beat…"); return; }
  // line the taps up around the first one (a tap can't be more than half a beat off)
  const bl = beatLen(), last = taps.slice(-TAPS_NEEDED), ref = last[0];
  const adj = last.map((d) => d - Math.round((d - ref) / bl) * bl);
  let med = median(adj);
  const dev = median(adj.map((d) => Math.abs(d - med)));
  // taps only tell us the distance to *a* beat: take the smallest correction, so we never
  // shift by a whole beat (big delays are already measured automatically)
  med -= Math.round(med / bl) * bl;
  if (dev > 0.06) {
    if (taps.length >= TAPS_NEEDED * 3) return stopTapSync("The taps were too uneven to use – sync unchanged. Try again.");
    drawTap("Nearly there – keep tapping steadily on every beat…"); return;
  }
  setTrim(med);
  stopTapSync("✓ In sync");
}
$("syncBtn").onclick = () => (tapMode ? stopTapSync() : startTapSync());
// manual beat offset: + = beats start 10 ms later than the audio
$("offPlus").onclick = () => setTrim(trim - 0.01);
$("offMinus").onclick = () => setTrim(trim + 0.01);
$("offReset").onclick = () => setTrim(0);

loadSync();
load(true); requestAnimationFrame(loop);
</script>
</body>
